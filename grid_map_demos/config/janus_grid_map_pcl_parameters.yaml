pcl_grid_map_extraction:
  num_processing_threads: 8
  cloud_transform:
    translation:
      x: 0.0
      y: 0.0
      z: 0.6457
    rotation:
      r: 0.0
      p: 0.0
      y: 0.0
  cluster_extraction:
    cluster_tolerance: 0.1
    min_num_points: 1
    max_num_points: 1000000
  outlier_removal:
    is_remove_outliers: true
    mean_K: 10
    stddev_threshold: 2.0
  downsampling:
    is_downsample_cloud: true
    voxel_size:
      x: 0.05
      y: 0.05
      z: 0.05
  grid_map:
    min_num_points_per_cell: 1
    resolution: 0.1
    height_type: 1
    height_thresh: 2.0