pcl_grid_map_extraction:
  num_processing_threads: 4
  cloud_transform:
    translation:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation:
      r: 0.0
      p: 0.0
      y: 0.0
  cluster_extraction:
    cluster_tolerance: 0.08
    min_num_points: 3
    max_num_points: 1000000
  outlier_removal:
    is_remove_outliers: false
    mean_K: 10
    stddev_threshold: 2.0
  downsampling:
    is_downsample_cloud: true
    voxel_size:
      x: 0.01
      y: 0.01
      z: 0.01
  grid_map:
    min_num_points_per_cell: 1
    resolution: 0.10
    height_type: 0
    height_thresh: 2.0